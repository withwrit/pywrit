name: Release pywrit, writ-mcp, writ-scan, and Action tags

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm CLI with trusted publishing support
        run: npm install -g npm@"^11.5.1"

      - name: Install Python build tools
        run: python -m pip install build twine

      - name: Build and publish pywrit
        run: |
          python -m build
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Build and publish writ-mcp
        if: hashFiles('mcp/pyproject.toml') != ''
        working-directory: mcp
        run: |
          python -m build
          twine upload --skip-existing dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

      - name: Build and publish writ-scan npm package
        if: hashFiles('npm/package.json') != ''
        working-directory: npm
        # OIDC trusted publishing is configured but not yet working for this
        # package on npmjs.com; falling back to NPM_TOKEN for v0.2.7 only.
        # id-token: write is kept so OIDC can be re-enabled once registry-side
        # claim matching is fixed.
        run: |
          PKG_VERSION=$(node -p 'require("./package.json").version')
          if [ "$(npm view writ-scan version 2>/dev/null || true)" = "$PKG_VERSION" ]; then
            echo "writ-scan $PKG_VERSION already published; skipping npm publish"
            exit 0
          fi
          printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' "${NPM_TOKEN}" > .npmrc
          npm publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Move GitHub Action major/minor tags
        if: hashFiles('action.yml') != ''
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          MAJOR="v${VERSION%%.*}"
          MINOR="v$(echo "$VERSION" | cut -d. -f1-2)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin --tags --force
          for TAG in "$MAJOR" "$MINOR"; do
            git tag -fa "$TAG" "$GITHUB_REF_NAME" -m "Release $TAG pointing to $GITHUB_REF_NAME"
            git push -f origin "$TAG"
          done

      - name: Open release checklist issue
        if: hashFiles('.github/RELEASE_CHECKLIST.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF_NAME}
          sed "s/__VERSION__/${VERSION}/g" .github/RELEASE_CHECKLIST.md > /tmp/checklist.md
          gh issue create --title "Release checklist: ${VERSION}" --body-file /tmp/checklist.md --label release || true

  mcp-registry:
    name: Publish server.json to Official MCP Registry
    needs: release
    runs-on: ubuntu-latest
    # This job uses GitHub OIDC (requires id-token: write at workflow level).
    # mcp/pyproject.toml is assumed to exist; the job reads writ-mcp's version from it.
    steps:
      - uses: actions/checkout@v4

      - name: Get writ-mcp version
        id: mcp-version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('mcp/pyproject.toml').read(), re.M).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/
          mcp-publisher --version || true

      - name: Stamp version into server.json
        env:
          MCP_VERSION: ${{ steps.mcp-version.outputs.version }}
        run: |
          python3 - "$MCP_VERSION" <<'PY'
          import json, sys
          from pathlib import Path
          ver = sys.argv[1]
          p = Path("server.json")
          data = json.loads(p.read_text())
          data["version"] = ver
          data["packages"][0]["version"] = ver
          p.write_text(json.dumps(data, indent=2) + "\n")
          PY

      - name: Check whether this version is already published
        id: registry-check
        env:
          MCP_VERSION: ${{ steps.mcp-version.outputs.version }}
        run: |
          CURRENT=$(curl -s "https://registry.modelcontextprotocol.io/v0/servers?search=io.github.withwrit/writ" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print(next((s['server']['version'] for s in d.get('servers',[]) if s['server']['name']=='io.github.withwrit/writ'), ''))")
          echo "registry currently serves: ${CURRENT:-<none>}; this release would publish: $MCP_VERSION"
          if [ "$CURRENT" = "$MCP_VERSION" ]; then
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to registry.modelcontextprotocol.io
        if: steps.registry-check.outputs.already_published != 'true'
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish server.json

  github-release:
    # Create the GitHub Release object for the tag. The repo's /releases page
    # (and the marketing site's Changelog link) reads from these objects; the
    # rest of this workflow only pushes tags and publishes packages, which is
    # why the releases page sat empty through v0.2.8. Notes are generated
    # from the merged PRs since the previous tag. Idempotent: a re-run skips
    # a release that already exists. Depends only on the main release job so
    # a failure in the registry or Smithery jobs cannot block it.
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists; skipping"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME"
