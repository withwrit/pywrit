[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pywrit"
version = "0.2.15"
description = "Python client + CLI for Writ — the gate before the write"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# `pip install 'pywrit[polyglot]'`: lets `writ scan` parse TypeScript,
# JavaScript, and Go (scan only). Python scanning never needs it.
polyglot = [
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-go>=0.23",
]
keywords = ["ai-agents", "policy", "audit-log", "guardrails"]

[project.urls]
Homepage = "https://withwrit.com"
Documentation = "https://docs.withwrit.com"

[project.scripts]
writ = "pywrit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
